<div class="grid gap-8 lg:grid-cols-[1.2fr_0.8fr]">
  <section class="rounded-3xl bg-slate-900 p-6 shadow-xl shadow-slate-950/50">
    <h2 class="text-2xl font-semibold text-white">2. Configure your custom sign</h2>
    <div class="mt-6 space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-300">Sign text</label>
        <input type="text" [(ngModel)]="sign.text" class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950 px-4 py-3 text-slate-100 focus:border-sky-400 focus:outline-none" />
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-300">Font family</label>
          <select [(ngModel)]="sign.font" class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950 px-4 py-3 text-slate-100">
            <option value="sans-serif">Sans Serif</option>
            <option value="serif">Serif</option>
            <option value="'Pacifico', cursive">Script</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300">Color</label>
          <input type="color" [(ngModel)]="sign.color" class="mt-2 h-12 w-full rounded-2xl border border-slate-800 bg-slate-950 p-2" />
        </div>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div>
          <label class="block text-sm font-medium text-slate-300">Width</label>
          <input type="number" [(ngModel)]="sign.width" min="80" max="600" class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950 px-4 py-3 text-slate-100" />
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300">Height</label>
          <input type="number" [(ngModel)]="sign.height" min="40" max="220" class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950 px-4 py-3 text-slate-100" />
        </div>
      </div>
      <div class="grid gap-4 sm:grid-cols-2">
        <div class="rounded-3xl border border-slate-800 bg-slate-950 p-4">
          <p class="text-sm font-medium text-slate-300">Move sign</p>
          <div class="mt-3 grid grid-cols-3 gap-2">
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700" (click)="moveSign('up')">Up</button>
            <div></div>
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700" (click)="moveSign('down')">Down</button>
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700" (click)="moveSign('left')">Left</button>
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700 col-span-2" (click)="moveSign('right')">Right</button>
          </div>
        </div>
        <div class="rounded-3xl border border-slate-800 bg-slate-950 p-4">
          <p class="text-sm font-medium text-slate-300">Resize sign</p>
          <div class="mt-3 grid grid-cols-2 gap-2">
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700" (click)="decreaseWidth()">- Width</button>
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700" (click)="increaseWidth()">+ Width</button>
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700" (click)="decreaseHeight()">- Height</button>
            <button type="button" class="rounded-2xl bg-slate-800 px-4 py-3 text-slate-100 hover:bg-slate-700" (click)="increaseHeight()">+ Height</button>
          </div>
        </div>
      </div>
      <div class="rounded-3xl border border-slate-800 bg-slate-950 p-4 text-slate-300">
        Drag the sign frame or use the buttons to position and resize the sign exactly where you want it.
      </div>
    </div>
  </section>

  <section class="rounded-3xl bg-slate-900 p-6 shadow-xl shadow-slate-950/50">
    <h2 class="text-2xl font-semibold text-white">Preview</h2>
    <div class="mt-6 rounded-3xl border border-slate-800 bg-black p-4">
      <div class="relative overflow-hidden rounded-3xl bg-slate-950 preview-canvas" style="min-height: 420px;">
        <img *ngIf="imagePreview" [src]="imagePreview" alt="Building preview" class="h-full w-full object-cover" />
        <div
          class="absolute flex items-center justify-center rounded-3xl border-2 border-sky-400/80 bg-sky-500/20 text-center text-white shadow-lg shadow-slate-950/20"
          [style.top.px]="sign.top"
          [style.left.px]="sign.left"
          [style.width.px]="sign.width"
          [style.height.px]="sign.height"
          [style.fontFamily]="sign.font"
          [style.color]="sign.color"
          (mousedown)="startDrag($event)"
        >
          <span class="px-4 text-lg font-semibold">{{ sign.text }}</span>
          <div class="resize-handle top-left" (mousedown)="startResize($event, 'nw')"></div>
          <div class="resize-handle top-right" (mousedown)="startResize($event, 'ne')"></div>
          <div class="resize-handle bottom-left" (mousedown)="startResize($event, 'sw')"></div>
          <div class="resize-handle bottom-right" (mousedown)="startResize($event, 'se')"></div>
        </div>
      </div>
    </div>
  </section>
</div>
