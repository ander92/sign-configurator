<section class="rounded-3xl bg-slate-900 p-8 shadow-xl shadow-slate-950/50">
  <h2 class="text-2xl font-semibold text-white">1. Încarcă sau generează o imagine a vitrinei</h2>
  <p class="mt-2 text-slate-400">Încarcă o poză cu clădirea sau generează o imagine cu OpenAI înainte de a plasa semnul.</p>

  <div class="mt-6 space-y-4">
    <label class="block rounded-2xl border border-slate-800 bg-slate-950 p-4 hover:border-slate-600">
      <span class="text-slate-300">Introdu un prompt pentru generarea imaginii cu OpenAI</span>
      <textarea
        [(ngModel)]="prompt"
        rows="4"
        class="mt-3 w-full rounded-2xl border border-slate-800 bg-slate-950 p-4 text-slate-100 outline-none focus:border-sky-500"
        placeholder="Exemplu: Lemnoor — litere neon strălucitoare pe o firma luminoasă modernă"
      ></textarea>
    </label>

    <div class="flex items-center gap-3">
      <div class="flex-1">
        <label class="block text-sm text-slate-300">Dimensiune imagine</label>
        <select [(ngModel)]="selectedSize" class="mt-2 w-full rounded-2xl border border-slate-800 bg-slate-950 px-4 py-2 text-slate-100">
          <option *ngFor="let s of sizeOptions" [value]="s">{{ s }}</option>
        </select>
      </div>

        <button
        type="button"
        class="rounded-2xl bg-emerald-500 px-6 py-3 text-sm font-semibold text-slate-950 hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-50"
        [disabled]="isGenerating || !prompt.trim() || validationError"
        (click)="generateImage()"
      >
        {{ isGenerating ? 'Se generează...' : 'Generează cu OpenAI' }}
      </button>
    </div>

    <div *ngIf="validationError" class="text-sm text-red-300 mt-2">{{ validationError }}</div>

    <div *ngIf="openAiError" class="rounded-2xl bg-red-950/70 p-4 text-red-300">
      {{ openAiError }}
    </div>

    <label class="block rounded-2xl border border-slate-800 bg-slate-950 p-4 cursor-pointer hover:border-slate-600">
      <span class="text-slate-300">Sau încarcă propria imagine</span>
      <input type="file" accept="image/*" (change)="onFileChange($event)" class="mt-3 block w-full text-sm text-slate-200" />
    </label>

    <div *ngIf="imagePreview" class="rounded-3xl overflow-hidden border border-slate-800 bg-black p-4">
      <div class="relative preview-canvas" style="min-height: 320px;">
        <img [src]="imagePreview" alt="Previzualizare clădire" class="w-full h-full object-cover" />

        <div *ngIf="generatedSign"
          class="absolute sign-overlay rounded-2xl bg-transparent"
          [style.top.px]="sign.top"
          [style.left.px]="sign.left"
          [style.width.px]="sign.width"
          [style.height.px]="sign.height"
          (mousedown)="startDragSign($event)">
          <img [src]="generatedSign" alt="Sign" class="w-full h-full object-contain pointer-events-none" />
          <div class="resize-handle top-left" (mousedown)="startResizeSign($event, 'nw')"></div>
          <div class="resize-handle top-right" (mousedown)="startResizeSign($event, 'ne')"></div>
          <div class="resize-handle bottom-left" (mousedown)="startResizeSign($event, 'sw')"></div>
          <div class="resize-handle bottom-right" (mousedown)="startResizeSign($event, 'se')"></div>
        </div>
      </div>

      <div class="mt-4 flex gap-3">
        <button
          type="button"
          class="rounded-2xl bg-sky-500 px-6 py-3 text-sm font-semibold text-slate-950 hover:bg-sky-400 disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="!imagePreview"
          (click)="downloadCombined()"
        >
          Descarcă imaginea finală
        </button>
        <button
          type="button"
          class="rounded-2xl bg-sky-500 px-6 py-3 text-sm font-semibold text-slate-950 hover:bg-sky-400 disabled:cursor-not-allowed disabled:opacity-50"
          [disabled]="!generatedSign"
          (click)="downloadImage()"
        >
          Descarcă doar semnul
        </button>
        <button
          type="button"
          class="rounded-2xl bg-gray-700 px-6 py-3 text-sm font-semibold text-slate-100 hover:bg-gray-600"
          (click)="reset()"
        >
          Resetează
        </button>
      </div>
    </div>
  </div>
</section>
